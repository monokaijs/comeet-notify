name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify Rust service
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Comeet Notify
            org.opencontainers.image.description=Rust GitLab webhook relay for FCM notifications and iOS Live Activities
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: comeet-notify-production
      cancel-in-progress: true
    permissions:
      contents: read

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
      IMAGE: ghcr.io/${{ github.repository }}:latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Pull latest image and restart service
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$IMAGE" "$DEPLOY_ENV_FILE" <<'REMOTE'
          set -euo pipefail

          image="$1"
          env_file="$2"
          container="comeet-notify"
          nginx_container="comeet-nginx"

          mapfile -t networks < <(
            sudo -n docker inspect \
              --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' \
              "$nginx_container" | awk 'NF'
          )
          if (( ${#networks[@]} == 0 )); then
            echo "Could not determine Docker networks from $nginx_container" >&2
            exit 1
          fi

          sudo -n docker pull "$image"
          sudo -n docker rm --force "$container" 2>/dev/null || true

          sudo -n docker run --detach \
            --name "$container" \
            --network "${networks[0]}" \
            --restart unless-stopped \
            --env-file "$env_file" \
            --publish 127.0.0.1:3000:3000 \
            "$image"

          for network in "${networks[@]:1}"; do
            sudo -n docker network connect "$network" "$container"
          done

          # The image has a Docker healthcheck. Do not touch nginx until the relay
          # is actually accepting traffic.
          for _ in {1..30}; do
            health="$(sudo -n docker inspect --format '{{.State.Health.Status}}' "$container")"
            [[ "$health" == "healthy" ]] && break
            [[ "$health" == "unhealthy" ]] && {
              sudo -n docker logs --tail 100 "$container" >&2 || true
              exit 1
            }
            sleep 1
          done
          [[ "$(sudo -n docker inspect --format '{{.State.Health.Status}}' "$container")" == "healthy" ]]

          # nginx resolves upstream hostnames when config is loaded. Restart it so
          # it resolves the replacement container, then prove the config resolves.
          sudo -n docker restart "$nginx_container"
          sudo -n docker exec "$nginx_container" nginx -t
          REMOTE
