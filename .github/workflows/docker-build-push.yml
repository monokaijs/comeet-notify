name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify Rust service
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Comeet Notify
            org.opencontainers.image.description=Rust GitLab webhook relay for FCM notifications and iOS Live Activities
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: comeet-notify-production
      cancel-in-progress: true
    permissions:
      contents: read

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
      IMAGE: ghcr.io/${{ github.repository }}@${{ needs.build-and-push.outputs.digest }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9._:-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_ENV_FILE" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ -n "$DEPLOY_SSH_KEY" ]]
          [[ -n "$DEPLOY_KNOWN_HOSTS" ]]

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy container
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$IMAGE" "$DEPLOY_ENV_FILE" <<'REMOTE'
          set -euo pipefail

          image="$1"
          env_file="$2"
          container="comeet-notify"

          if [[ ! -f "$env_file" ]]; then
            echo "Deployment environment file not found: $env_file" >&2
            exit 1
          fi

          previous_image="$(docker inspect --format '{{.Image}}' "$container" 2>/dev/null || true)"
          docker pull "$image"
          docker rm --force "$container" 2>/dev/null || true

          start_container() {
            docker run --detach \
              --name "$container" \
              --restart unless-stopped \
              --env-file "$env_file" \
              --publish 127.0.0.1:3000:3000 \
              "$1"
          }

          if ! start_container "$image"; then
            if [[ -n "$previous_image" ]]; then
              start_container "$previous_image"
            fi
            exit 1
          fi

          for attempt in {1..30}; do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")"
            if [[ "$health" == "healthy" ]]; then
              docker image prune --force >/dev/null
              exit 0
            fi
            if [[ "$health" == "unhealthy" || "$health" == "none" ]]; then
              break
            fi
            sleep 2
          done

          docker logs --tail 100 "$container" >&2 || true
          docker rm --force "$container" 2>/dev/null || true
          if [[ -n "$previous_image" ]]; then
            start_container "$previous_image"
          fi
          exit 1
          REMOTE
