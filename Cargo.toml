[package]
name = "comeet-notify"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
description = "GitLab webhook to FCM notification bridge"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["http1", "json", "matched-path", "original-uri", "tokio"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto", "use_pem"] }
regex = "1.12.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "http2", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "serde"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
urlencoding = "2.1.3"
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[dev-dependencies]
http-body-util = "0.1.3"
rand = "0.8.5"
rsa = { version = "0.9.10", features = ["pem"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
